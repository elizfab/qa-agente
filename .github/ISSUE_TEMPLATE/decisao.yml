name: Decisão de arquitetura
description: Abrir discussão que vai virar uma ADR
title: "adr: "
labels: [decisao]
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Qual decisão precisa ser tomada e por quê agora?
    validations:
      required: true
  - type: textarea
    id: opcoes
    attributes:
      label: Opções
      description: Liste as opções com prós e contras.
    validations:
      required: true
  - type: input
    id: prazo
    attributes:
      label: Até quando precisa estar decidido?
