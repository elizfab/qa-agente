name: docs

on:
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - ".markdownlint-cli2.jsonc"
      - ".lycheeignore"
      - ".github/workflows/docs.yml"
  push:
    branches: [main, develop]
    paths:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  links:
    name: Links quebrados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # --offline: verifica só links internos (arquivos e âncoras do repositório),
          # sem depender de sites externos que podem estar fora do ar.
          args: --offline --no-progress --exclude-path docs/arquivo "./**/*.md"
          fail: true
